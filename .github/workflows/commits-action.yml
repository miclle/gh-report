name: Commits Action

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Exercise commits Action
        uses: ./actions/commits
        with:
          github-avatars: 'false'
          report-branch: gh-report
      - name: Exercise commits Action without artifacts
        id: without-artifacts
        uses: ./actions/commits
        with:
          chart: 'false'
          upload-artifacts: 'false'
      - name: Verify outputs without artifacts
        env:
          HEAD_SHA: ${{ steps.without-artifacts.outputs.head-sha }}
          ARTIFACT_URL: ${{ steps.without-artifacts.outputs.artifact-url }}
          CHART_URL: ${{ steps.without-artifacts.outputs.chart-url }}
        run: |
          test -n "$HEAD_SHA"
          test -z "$ARTIFACT_URL"
          test -z "$CHART_URL"
